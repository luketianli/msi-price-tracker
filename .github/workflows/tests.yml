name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      # The suite is fully offline -- scrapers are exercised against fixtures.
      - name: Run tests
        run: python -m pytest
